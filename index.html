<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Muse-Desktop</title>
    <style>
      html,
      body {
        min-width: 320px;
        min-height: 100%;
        margin: 0;
        background: #172329;
      }

      #boot-screen {
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 14px;
        color: #e9eff3;
        font: 600 14px/1.4 "DM Sans", Arial, sans-serif;
        letter-spacing: 0.01em;
      }

      #boot-screen img {
        width: 48px;
        height: 48px;
        justify-self: center;
        filter: drop-shadow(0 8px 20px #0866ff55);
      }

      #boot-screen span {
        color: #92a2ad;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-screen" role="status" aria-live="polite">
        <img src="/favicon.png" alt="Muse-Desktop" />
        <span>Loading Muse-Desktop…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
