name: Release

# A version tag (v0.1.0-beta.2) builds the Windows installer and the macOS DMG,
# tests them, and publishes both in one GitHub release. A pull request that
# changes this workflow, or a manual run (workflow_dispatch, on any branch),
# runs the same builds as a dry run: nothing is published, the artifacts are
# kept for a week.
#
# macOS signing and notarization need every one of these secrets; with none of
# them the DMG is ad-hoc signed (dry runs, forks), with only some the job fails:
#   MAC_CERTIFICATE_P12          base64 Developer ID Application .p12
#   MAC_CERTIFICATE_PASSWORD     password of that .p12
#   APPLE_ID                     Apple account used by notarytool
#   APPLE_TEAM_ID                Apple Developer team (M4LK7C6S84)
#   APPLE_APP_SPECIFIC_PASSWORD  app-specific password for notarytool
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]
  workflow_dispatch:

concurrency:
  group: muse-desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  # Creating the release.
  contents: write

# No build bundles the Muse engine: the app uses the one the user installed
# with Meta's official installer.
jobs:
  windows:
    name: Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read the version, and check the tag matches it
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the app version $version"
            exit 1
          fi
          test -f "docs/releases/$version.md" || { echo "::error::missing docs/releases/$version.md"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "BUNDLE=src-tauri/target/release/bundle/nsis" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build the installer
        run: npx tauri build --bundles nsis

      # Packs the app `tauri build` just left in target/release.
      # Pre-releases never reach the Store, and MSIX has no place for their
      # suffix.
      - name: Package the Store MSIX
        if: ${{ !contains(env.VERSION, '-') }}
        run: node scripts/build-msix.mjs

      - name: Keep the Store MSIX
        if: ${{ !contains(env.VERSION, '-') }}
        uses: actions/upload-artifact@v4
        with:
          # Not muse-desktop-*: the package is unsigned until the Store signs
          # it, so it is not published with the release.
          name: store-msix
          path: src-tauri/target/msix/*.msix
          if-no-files-found: error
          retention-days: 30

      - name: Run supervisor tests
        run: cargo test --release --manifest-path src-tauri/Cargo.toml

      - name: Write the integrity manifest
        run: |
          installer="$BUNDLE/Muse-Desktop_${VERSION}_x64-setup.exe"
          test -f "$installer" || { ls "$BUNDLE"; echo "::error::installer not found"; exit 1; }
          node scripts/release-manifest.mjs --artifact "$installer" --version "$VERSION" \
            --output "$BUNDLE/Muse-Desktop_${VERSION}_x64-setup.manifest.json"
          cat "$BUNDLE/Muse-Desktop_${VERSION}_x64-setup.manifest.json"

      - name: Keep the installer
        uses: actions/upload-artifact@v4
        with:
          name: muse-desktop-windows
          path: ${{ env.BUNDLE }}/Muse-Desktop_*_x64-setup.*
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS Apple Silicon DMG
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read the version
        run: echo "VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Run supervisor tests
        run: |
          mkdir -p dist
          [ -f dist/index.html ] || printf '<!doctype html><title>CI</title>\n' > dist/index.html
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Import the signing certificate
        env:
          MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -eu
          present=0
          missing=""
          for name in MAC_CERTIFICATE_P12 MAC_CERTIFICATE_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD; do
            # Names only: a value is never printed.
            if [ -n "$(printenv "$name")" ]; then present=$((present + 1)); else missing="$missing $name"; fi
          done
          if [ "$present" = 0 ]; then
            if [ "$GITHUB_EVENT_NAME" = push ]; then
              echo "::error::a published macOS build must be signed and notarized; set the Apple secrets"
              exit 1
            fi
            echo "::warning::no Apple secrets: the dry-run DMG is ad-hoc signed"
            exit 0
          fi
          if [ "$present" != 5 ]; then
            echo "::error::the Apple signing secrets are incomplete ($present of 5); empty or missing:$missing"
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$MAC_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MAC_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -n 1)
          [ -n "$identity" ] || { echo "::error::no Developer ID Application identity in the certificate"; exit 1; }
          xcrun notarytool store-credentials muse-notary --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --keychain "$keychain"
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "NOTARY_PROFILE=muse-notary" >> "$GITHUB_ENV"
          echo "NOTARY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build, sign and notarize the DMG
        run: sh scripts/build-macos.sh --bundle dmg --target aarch64-apple-darwin

      - name: Keep the DMG
        uses: actions/upload-artifact@v4
        with:
          name: muse-desktop-macos
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/Muse-Desktop_*_aarch64.dmg
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the GitHub release
    if: github.event_name == 'push'
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Collect the builds
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          pattern: muse-desktop-*
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          ls -la dist-release
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag $prerelease \
            --title "Muse-Desktop $version (Windows x64, macOS Apple Silicon)" \
            --notes-file "docs/releases/$version.md" \
            dist-release/*

  store:
    name: Submit to the Microsoft Store
    # Stable tags only, after the GitHub release: the Store gets the same
    # build, as an update of product 9NBPFWQBGLZG published as soon as it passes certification.
    if: github.event_name == 'push' && !contains(github.ref_name, '-')
    needs: [windows, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Collect the Store package
        uses: actions/download-artifact@v4
        with:
          name: store-msix
          path: store

      - name: Submit
        env:
          STORE_APP_ID: 9NBPFWQBGLZG
          STORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          STORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
        run: |
          # All three or none: with none the Store step is reported as not
          # configured (upload by hand); with only some, a secret is misnamed.
          set=0; for v in STORE_TENANT_ID STORE_CLIENT_ID STORE_CLIENT_SECRET; do [ -n "${!v}" ] && set=$((set+1)); done
          if [ "$set" = 0 ]; then
            echo "::warning::Microsoft Store secrets not set: upload the store-msix artifact by hand"
            echo "Store submission skipped: MSSTORE_* secrets not set. Upload the store-msix artifact in Partner Center." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ "$set" = 3 ] || { echo "::error::MSSTORE_TENANT_ID, MSSTORE_CLIENT_ID and MSSTORE_CLIENT_SECRET must all be set"; exit 1; }
          packages=(store/*.msix)
          [ "${#packages[@]}" = 1 ] && [ -f "${packages[0]}" ] || { echo "::error::expected one MSIX, found: ${packages[*]}"; exit 1; }
          bash scripts/store-submit.sh "${packages[0]}"
          echo "Submitted $(basename "${packages[0]}") to the Store; it goes live once certification passes." >> "$GITHUB_STEP_SUMMARY"
