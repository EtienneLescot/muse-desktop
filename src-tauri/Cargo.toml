[package]
name = "muse-desktop"
version = "0.4.0"
description = "Desktop shell (Tauri) around the Muse Code harness — thin sidecar supervisor, no agentic logic."
edition = "2021"
rust-version = "1.78.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["test"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "=2.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
notify = "6.1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
portable-pty = "0.8"
futures-util = "0.3"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream"] }
# Remote MCP credentials use the platform-native secure store (Windows
# Credential Manager, macOS Keychain, Secret Service/keyutils on Linux).
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust", "vendored"] }
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
] }
windows = { version = "0.61.3", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_Accessibility",
] }

[target.'cfg(unix)'.dependencies]
# kill(2) of a worktree setup's process group (git.rs stop_setup); already in the tree.
libc = "0.2"

# The WKWebView test bridge (test_bridge.rs, debug builds only) and the test
# instance's data store id. All of these are already in the tree through wry.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSGeometry"] }
sha1 = "0.10"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
